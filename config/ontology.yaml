# Ontology — versioned entity and relation types.
#
# This is a STARTING POINT for M0 (ARCHITECTURE.md), expected to be revised
# once real extraction output shows what the documents actually produce.
#
# Growth is human-in-the-loop only (DECISIONS.md: "Ontology growth gating").
# The extraction agent MAY PROPOSE new types (surfaced separately as
# proposals), but nothing here changes without explicit human approval.
# Bump `version` whenever a type is added, removed or materially redefined.

version: 3

# Types the extraction LLM should populate. `examples` steer extraction and
# disambiguation; they are illustrative, not an enum.
#
# An entity type may declare `attributes`: named properties the extractor
# should populate where the text supports them. An attribute with `values`
# is a controlled vocabulary (the extractor must pick one); without, it is
# free text with the description as guidance. Attributes are omitted when not
# evidenced — they are not mandatory. (Attribute-level provenance is not
# modelled yet; an entity carries a single provenance for now — revisit if
# per-attribute sourcing proves necessary.)
entity_types:
  - name: Programme
    description: >-
      A named defence programme, project, or initiative.
    examples: [Sense-Decide-Effect, Digital Targeting Web, ASGARD, FADS]

  - name: Organisation
    description: >-
      Any organisation — governmental or non-governmental — including
      companies, government departments, military commands, agencies,
      academic institutions and multinational bodies. Distinguish the kind
      via the `org_type` attribute rather than separate entity types.
    examples: [BAE Systems, Ministry of Defence, Royal Navy, NATO, Leonardo]
    attributes:
      - name: org_type
        description: The kind of organisation.
        values: [government, military, commercial, academic, ngo, multinational, other]
      - name: nationality
        description: >-
          Controlling nation (e.g. UK, USA, France) or "multinational" for
          bodies like NATO. Omit where global or not meaningful.

  - name: Hardware
    description: >-
      A physical platform, system, or piece of equipment.
    examples: [Ajax, F-35, Type 83 destroyer, a specific radar system]

  - name: Capability
    description: >-
      A defence capability — an ability to achieve a military effect, distinct
      from the Programme that delivers it and the Hardware that realises it.
    examples: [Integrated Air and Missile Defence, ISTAR, deep strike]

  - name: Location
    description: >-
      A geographic place, site, base or facility. Covers sites, facilities and
      infrastructure as one type rather than several.
    examples: [HMNB Clyde, Barrow-in-Furness shipyard, a named airbase]

  - name: Role
    description: >-
      An organisational role or post, captured as the position itself (e.g.
      Chief Information Officer, Senior Responsible Owner). Named individuals
      holding a role are deliberately NOT extracted or stored — see
      DECISIONS.md (named individuals out of scope).
    examples: [Chief Information Officer, Senior Responsible Owner]

  - name: Standard
    description: >-
      A technical standard, protocol, or interoperability specification.
    examples: [Cursor on Target, Link 16, Sapient]

  - name: Term
    description: >-
      Domain vocabulary worth tracking as a concept in its own right, not
      merely as an alias of another entity.
    examples: [DDIL, DLOD, Digital Backbone]

  - name: Tender
    description: >-
      An invitation to tender, open or historical. Time-bounded by nature
      (open/closed status, closing date). The entity type exists from M0
      even though active tender monitoring (pull ingestion) is out of scope,
      because push-ingested documents will reference tenders.
    examples: [a named procurement competition]

  - name: Source
    description: >-
      A document or web page. A first-class node (not metadata) so facts can
      be traced to source credibility. Source nodes are created by the
      ingestion pipeline, not proposed by the extraction LLM.
    system_managed: true
    examples: [The Defence Investment Plan, a company press release]

# Relations the extraction LLM should populate, with domain/range guidance.
# `structural` relations are managed by the pipeline (provenance, entity
# resolution, mentions) rather than freely emitted as domain facts.
relation_types:
  - name: develops
    description: >-
      An organisation or programme develops a programme, capability or piece
      of hardware.
    domain: [Organisation, Programme]
    range: [Programme, Hardware, Capability]

  - name: delivers
    description: >-
      An organisation or programme delivers a programme, capability or piece
      of hardware.
    domain: [Organisation, Programme]
    range: [Programme, Hardware, Capability]

  - name: part_of
    description: >-
      One entity is part of a larger one — a programme within a programme, a
      hardware subsystem within a larger platform, or an organisation within a
      larger organisation.
    domain: [Programme, Hardware, Organisation]
    range: [Programme, Organisation, Hardware]

  - name: implements_standard
    description: A piece of hardware or programme implements a standard.
    domain: [Hardware, Programme]
    range: [Standard]

  - name: funds
    description: >-
      An organisation (e.g. a government body) or programme funds a programme,
      capability, piece of hardware, or another organisation.
    domain: [Organisation, Programme]
    range: [Programme, Hardware, Capability, Organisation]

  - name: invests_in
    description: An organisation or programme directs investment towards a programme or capability.
    domain: [Organisation, Programme]
    range: [Programme, Capability]

  - name: supports
    description: An organisation or programme supports or enables a programme, capability or concept.
    domain: [Organisation, Programme]
    range: [Programme, Capability, Term]

  - name: governs
    description: An organisation governs or sets strategic direction for a programme or another organisation.
    domain: [Organisation]
    range: [Programme, Organisation]

  - name: member_of
    description: An organisation is a member of another organisation (e.g. an alliance or board).
    domain: [Organisation]
    range: [Organisation]

  - name: extracted_from
    description: >-
      Provenance edge from an extracted entity to its Source, one per
      extraction. Mandatory on every extracted entity — attached by the
      pipeline, not emitted by the LLM. A relation has no such edge (an edge
      cannot start from another edge); it carries the same provenance as its
      own properties and traces back to its Source through its source_id.
    structural: true
    domain: ["*"]
    range: [Source]

  - name: same_as
    description: >-
      Confidence-weighted identity link between two distinct nodes. Never a
      destructive merge. Created by the entity-resolution pipeline (M2), not
      by the extraction LLM.
    structural: true
    domain: ["*"]
    range: ["*"]

  - name: mentions
    description: >-
      A Source mentions an existing entity — lighter-weight than a
      substantive relation; used for "mention of existing data" review items.
    structural: true
    domain: [Source]
    range: ["*"]
