# Extraction / Vertex configuration.
#
# `project` and `location` fall back to the GOOGLE_CLOUD_PROJECT /
# GOOGLE_CLOUD_LOCATION environment variables if left blank, so credentials
# and project config need not be duplicated here. See SETUP.md.

vertex:
  project: "yesknowmaybe"
  location: "europe-west2"

extraction:
  # Default to a Flash-class model for the M0 pass; the Pro-vs-Flash (and
  # Gemini generation) decision is made against real M0 output on the
  # accuracy/cost trade-off (DECISIONS.md: extraction model).
  model: "gemini-2.5-flash"
  temperature: 0.0

embedding:
  # Vertex embeddings for the vector channel and entity-resolution shortlist
  # (DECISIONS.md: embeddings). Full native width kept — no MRL truncation.
  model: "gemini-embedding-001"
  dimension: 3072
  # gemini-embedding output at full width is already L2-normalised, so this is
  # a no-op at 3072; kept explicit so that if the dimension is ever reduced via
  # MRL truncation, re-normalisation is switched on deliberately, not forgotten.
  normalise: true

chunking:
  target_chars: 6000
  max_chars: 9000

alignment:
  # Post-hoc span alignment (ARCHITECTURE.md: span-level provenance). The quote
  # is the input, the offset is derived — nothing here ever trusts a claimed
  # offset. These are tuning parameters, expected to move once alignment rates
  # across the real corpus are understood (see notes/M1-alignment.md).
  #
  # Floor for the bounded fuzzy stage: difflib SequenceMatcher ratio between the
  # normalised source slice and the normalised quote. Below this the fact is
  # UNRESOLVED — never a guessed span.
  #
  # Set from evidence, not taste (notes/M1-alignment.md): across the three M0
  # documents every *correct* fuzzy match scores >= 0.953 (they are single
  # whitespace/hyphen artefacts in an otherwise identical quote), while every
  # *wrong* one scores <= 0.946 — those are quotes the model stitched from
  # non-contiguous text, where a long shared prefix carries the ratio while the
  # tail points at the wrong item. 0.95 separates the two and costs 1.3pp of
  # raw alignment rate on the largest document (22 of 1735 facts).
  min_ratio: 0.95
  # Quotes shorter than this are never fuzzy-matched: over a handful of
  # characters the ratio is too coarse to tell a near-miss from a different
  # word ("Royal Navvy" scores 0.952 against "Royal Navy"). Short quotes still
  # align via the exact/normalised stages. At the 0.95 floor this rail is
  # currently inert on the M0 corpus — the ratio rejects those cases first — and
  # is kept so that lowering min_ratio cannot start snapping short entity names
  # onto near-neighbours.
  min_fuzzy_chars: 12

storage:
  # Which backend the storage adapter uses (DECISIONS.md: knowledge store).
  # Kùzu is embedded — no credentials, unattended-buildable — and is the default
  # for local/automated work; Spanner Graph is the canonical/production target.
  # Both sit behind one adapter interface; schema is app-owned, not Terraform.
  backend: "kuzu"   # kuzu | spanner
  kuzu:
    # Embedded on-disk DB directory (gitignored).
    path: "data/graph.kuzu"
  spanner:
    # project falls back to GOOGLE_CLOUD_PROJECT if blank, as vertex.project does.
    # instance/database must match the Terraform-provisioned resources.
    project: "yesknowmaybe"
    instance: "dikms-kg"
    database: "knowledge"
