[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dikms"
version = "0.0.0"
description = "Defence Industry Knowledge Management System — ingestion, extraction and retrieval backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rupert Thomas" }]

# Dependencies are kept deliberately light (see CLAUDE.md). Each is justified:
#   pyyaml       — human-authored config/data files (ontology, sources, extraction)
#   pypdf        — text-native PDF parsing with page structure (pure-Python, MIT)
#   trafilatura  — HTML main-content extraction, stripping nav/boilerplate/ads
#   google-genai — Gemini extraction via Vertex AI (see DECISIONS.md)
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "trafilatura>=1.12",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dikms = "dikms.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dikms"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
