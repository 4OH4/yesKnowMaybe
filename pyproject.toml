[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dikms"
version = "0.0.0"
description = "Defence Industry Knowledge Management System — ingestion, extraction and retrieval backend"
readme = "README.md"
# Upper bound: kuzu ships no cp314 wheel yet and its source build is heavy, so
# the embedded store backend needs 3.11–3.13. Lift the cap once kuzu publishes
# a Python 3.14 wheel.
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Rupert Thomas" }]

# Dependencies are kept deliberately light (see CLAUDE.md). Each is justified:
#   pyyaml       — human-authored config/data files (ontology, sources, extraction)
#   pypdf        — text-native PDF parsing with page structure (pure-Python, MIT)
#   trafilatura  — HTML main-content extraction, stripping nav/boilerplate/ads
#   google-genai — Gemini extraction via Vertex AI (see DECISIONS.md)
#   kuzu         — embedded graph + vector store; the storage adapter's local
#                  backend (DECISIONS.md: knowledge store), no running infra
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "trafilatura>=1.12",
    "google-genai>=1.0",
    "kuzu>=0.6",
]

[project.scripts]
dikms = "dikms.cli:main"

# Dev tooling as a uv dependency group (installed by `uv sync` by default, not
# shipped with the package). See DECISIONS.md: project managed with uv.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dikms"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
